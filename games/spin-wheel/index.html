<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAY Spin & Win — Play & Earn</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.logo { font-size: 24px; font-weight: 800; }
.logo span { color: #ffd700; }
.wallet-btn {
  background: linear-gradient(135deg, #ffd700, #ff8800);
  border: none; padding: 10px 20px; border-radius: 12px;
  color: #000; font-weight: 600; cursor: pointer; font-size: 14px;
}
.wallet-btn.connected { background: linear-gradient(135deg, #00ff88, #00cc66); color: #fff; }
.container { max-width: 480px; margin: 0 auto; padding: 24px 16px; text-align: center; }

/* Balance */
.balance-card {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 24px; margin-bottom: 24px;
}
.balance-label { font-size: 14px; color: #888; margin-bottom: 8px; }
.balance-amount { font-size: 42px; font-weight: 800; color: #ffd700; }

/* Wheel Container */
.wheel-container {
  position: relative; width: 320px; height: 320px; margin: 0 auto 24px;
}
.wheel-outer {
  position: absolute; width: 100%; height: 100%;
  border-radius: 50%; border: 6px solid rgba(255,215,0,0.3);
  box-shadow: 0 0 40px rgba(255,215,0,0.2);
}
canvas { border-radius: 50%; }
.pointer {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 18px solid transparent; border-right: 18px solid transparent;
  border-top: 36px solid #ffd700;
  filter: drop-shadow(0 4px 8px rgba(255,215,0,0.5));
  z-index: 10;
}

/* Spin Button */
.spin-btn {
  background: linear-gradient(135deg, #ffd700, #ff8800);
  border: none; padding: 18px 64px; border-radius: 16px;
  color: #000; font-size: 20px; font-weight: 800; cursor: pointer;
  transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
}
.spin-btn:hover { transform: scale(1.05); box-shadow: 0 4px 30px rgba(255,215,0,0.5); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Result Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: linear-gradient(135deg, #1a1a3a, #0a0a2a);
  border: 2px solid rgba(255,215,0,0.3); border-radius: 24px;
  padding: 40px; text-align: center; max-width: 360px; width: 90%;
}
.modal-emoji { font-size: 64px; margin-bottom: 16px; }
.modal-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.modal-amount { font-size: 48px; font-weight: 800; color: #ffd700; }
.modal-sub { font-size: 14px; color: #888; margin-top: 8px; }
.modal-btn {
  background: linear-gradient(135deg, #ffd700, #ff8800);
  border: none; padding: 14px 40px; border-radius: 12px;
  color: #000; font-weight: 700; cursor: pointer; margin-top: 20px; font-size: 16px;
}

/* Spins Left */
.spins-left {
  font-size: 14px; color: #888; margin-bottom: 16px;
}
.spins-left span { color: #ffd700; font-weight: 700; }

/* History */
.history {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 24px; margin-top: 24px;
}
.history-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.history-row {
  display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.history-row:last-child { border-bottom: none; }
.history-time { color: #666; font-size: 13px; }
.history-amount { color: #ffd700; font-weight: 700; }

.footer { text-align: center; padding: 24px; color: #444; font-size: 12px; }

@keyframes confetti {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
}
.confetti {
  position: fixed; width: 10px; height: 10px; top: -10px;
  animation: confetti 2s ease-out forwards; z-index: 200;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">JAY <span>Spin</span></div>
  <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
</div>

<div class="container">
  <div class="balance-card">
    <div class="balance-label">Your JAY Balance</div>
    <div class="balance-amount" id="balance">0.00</div>
  </div>

  <div class="spins-left">Spins left today: <span id="spinsLeft">3</span></div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="320" height="320"></canvas>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎰 SPIN</button>

  <div class="history">
    <div class="history-title">📋 Spin History</div>
    <div id="historyList">
      <div style="color:#666;font-size:14px;">No spins yet</div>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <div class="modal-title" id="modalTitle">Congratulations!</div>
    <div class="modal-amount" id="modalAmount">+5 JAY</div>
    <div class="modal-sub" id="modalSub">Added to your balance</div>
    <button class="modal-btn" onclick="closeModal()">Awesome!</button>
  </div>
</div>

<div class="footer">Powered by The Jay Network • games.thejaynetwork.com</div>

<script>
const JAY_RPC = 'http://152.53.195.5:1317';
const CHAIN_ID = 'thejaynetwork';

const SEGMENTS = [
  { label: '0.5 JAY', value: 0.5, color: '#ff6b6b' },
  { label: '1 JAY', value: 1, color: '#ffd93d' },
  { label: '2 JAY', value: 2, color: '#6bcb77' },
  { label: '0 JAY', value: 0, color: '#4d96ff' },
  { label: '5 JAY', value: 5, color: '#ff6b6b' },
  { label: '1 JAY', value: 1, color: '#ffd93d' },
  { label: '0.5 JAY', value: 0.5, color: '#6bcb77' },
  { label: '5 JAY', value: 5, color: '#ff922b' },
];

let walletAddress = null;
let spinning = false;
let currentRotation = 0;
let spinsLeft = parseInt(localStorage.getItem('jay_spins_left') || '3');
let lastSpinDate = localStorage.getItem('jay_spin_date');
let spinHistory = JSON.parse(localStorage.getItem('jay_spin_history') || '[]');

// Reset spins daily
const today = new Date().toDateString();
if (lastSpinDate !== today) {
  spinsLeft = 3;
  localStorage.setItem('jay_spins_left', spinsLeft);
  localStorage.setItem('jay_spin_date', today);
}
document.getElementById('spinsLeft').textContent = spinsLeft;

// Draw wheel
function drawWheel() {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const cx = 160, cy = 160, r = 150;
  const arc = (2 * Math.PI) / SEGMENTS.length;

  ctx.clearRect(0, 0, 320, 320);

  SEGMENTS.forEach((seg, i) => {
    const startAngle = i * arc - Math.PI / 2;
    const endAngle = startAngle + arc;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + arc / 2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(seg.label, r * 0.65, 5);
    ctx.restore();
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a3a';
  ctx.fill();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('JAY', cx, cy + 4);
}
drawWheel();

async function connectWallet() {
  if (walletAddress) return;
  const wallet = window.keplr || window.leap;
  if (!wallet) { alert('Install Keplr or Leap wallet!'); return; }
  try {
    await wallet.enable(CHAIN_ID);
    const key = await wallet.getKey(CHAIN_ID);
    walletAddress = key.bech32Address;
    const btn = document.getElementById('walletBtn');
    btn.textContent = walletAddress.slice(0, 8) + '...' + walletAddress.slice(-6);
    btn.classList.add('connected');
    fetchBalance();
  } catch (e) { alert('Connection rejected.'); }
}

async function fetchBalance() {
  if (!walletAddress) return;
  try {
    const resp = await fetch(`${JAY_RPC}/cosmos/bank/v1beta1/balances/${walletAddress}`);
    const data = await resp.json();
    const jay = data.balances.find(b => b.denom === 'ujay');
    if (jay) {
      document.getElementById('balance').textContent = (parseInt(jay.amount) / 1e6).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  } catch (e) {}
}

function spinWheel() {
  if (spinning) return;
  if (!walletAddress) { alert('Connect wallet first!'); return; }
  if (spinsLeft <= 0) { alert('No spins left today! Come back tomorrow.'); return; }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick weighted result
  const weights = [20, 25, 15, 15, 5, 10, 8, 2]; // lower = rarer
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let rand = Math.random() * totalWeight;
  let winIndex = 0;
  for (let i = 0; i < weights.length; i++) {
    rand -= weights[i];
    if (rand <= 0) { winIndex = i; break; }
  }

  const segAngle = 360 / SEGMENTS.length;
  const targetAngle = 360 - (winIndex * segAngle + segAngle / 2);
  const spins = 5 + Math.floor(Math.random() * 3);
  const finalRotation = currentRotation + spins * 360 + targetAngle;

  const canvas = document.getElementById('wheel');
  canvas.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
  canvas.style.transform = `rotate(${finalRotation}deg)`;
  currentRotation = finalRotation;

  setTimeout(() => {
    spinning = false;
    document.getElementById('spinBtn').disabled = false;

    const prize = SEGMENTS[winIndex];
    spinsLeft--;
    localStorage.setItem('jay_spins_left', spinsLeft);
    document.getElementById('spinsLeft').textContent = spinsLeft;

    // Add to history
    const entry = { time: new Date().toLocaleTimeString(), amount: prize.value, label: prize.label };
    spinHistory.unshift(entry);
    if (spinHistory.length > 10) spinHistory.pop();
    localStorage.setItem('jay_spin_history', JSON.stringify(spinHistory));
    updateHistory();

    // Show result
    if (prize.value > 0) {
      document.getElementById('modalEmoji').textContent = '🎉';
      document.getElementById('modalTitle').textContent = 'You Won!';
      document.getElementById('modalAmount').textContent = `+${prize.label}`;
      document.getElementById('modalSub').textContent = 'Added to your balance';
      spawnConfetti();
    } else {
      document.getElementById('modalEmoji').textContent = '😢';
      document.getElementById('modalTitle').textContent = 'Better Luck Next Time!';
      document.getElementById('modalAmount').textContent = '0 JAY';
      document.getElementById('modalSub').textContent = 'Try again tomorrow';
    }
    document.getElementById('resultModal').classList.add('show');

    // TODO: Submit to backend for actual reward distribution
    // submitReward(walletAddress, prize.value);
  }, 4200);
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
  fetchBalance();
}

function updateHistory() {
  const list = document.getElementById('historyList');
  if (spinHistory.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:14px;">No spins yet</div>';
    return;
  }
  list.innerHTML = spinHistory.map(h =>
    `<div class="history-row">
      <span class="history-time">${h.time}</span>
      <span class="history-amount">${h.amount > 0 ? '+' + h.label : 'No prize'}</span>
    </div>`
  ).join('');
}
updateHistory();

function spawnConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#6bcb77', '#4d96ff', '#ff922b'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}
</script>
</body>
</html>
